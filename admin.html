
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bliss Blog Admin</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>

  <section id="login-screen" class="login-box">
    <h1>BLISS ADMIN</h1>
    <p>Sign in to manage your blogs</p>
    <input id="password" type="password" placeholder="Admin password">
    <button id="login-btn">Login</button>
    <p id="login-message"></p>
  </section>

  <main id="dashboard" hidden>

    <header class="admin-header">
      <h2>Bliss Blog Manager</h2>
      <button id="logout-btn" class="secondary">Logout</button>
    </header>

    <!-- BLOG MANAGEMENT -->
    <section class="admin-content">
      <h1>Manage Blogs</h1>
      <p>View and manage all your chocolate blog articles.</p>

      <button type="button" id="refresh-blogs-btn">
        Refresh Blogs
      </button>

      <div id="blogs-list">
        <p>Login to load your blogs.</p>
      </div>

      <p id="manage-message"></p>
    </section>

    <!-- CREATE BLOG -->
    <section class="admin-content">
      <h1 id="form-heading">Create New Blog</h1>
      <p>Write, manage and publish your articles.</p>

      <form id="blog-form">

        <label>Blog Title</label>
        <input id="title" required maxlength="120"
          placeholder="Enter blog title">

        <label>URL Slug</label>
        <input id="slug" required
          placeholder="best-chocolate-gifts">

        <label>Category</label>
        <select id="category" required>
          <option value="">Select category</option>
          <option>Chocolate Gifts</option>
          <option>Chocolate Recipes</option>
          <option>Chocolate Benefits</option>
          <option>Birthday & Anniversary</option>
          <option>Chocolate Guides</option>
          <option>Festival Specials</option>
        </select>

        <label>Featured Image</label>
        <input id="image" type="file"
          accept="image/jpeg,image/png,image/webp" required>

        <label>Short Description</label>
        <textarea id="excerpt" rows="3"
          required maxlength="250"></textarea>

        <label>Blog Content</label>
      <div class="editor-toolbar">
  <button type="button" data-command="bold"><b>B</b></button>
  <button type="button" data-command="italic"><i>I</i></button>
  <button type="button" data-command="underline"><u>U</u></button>

  <select id="format-block">
    <option value="p">Paragraph</option>
    <option value="h2">Heading 2</option>
    <option value="h3">Heading 3</option>
  </select>

  <button type="button" data-command="insertUnorderedList">• List</button>
  <button type="button" data-command="insertOrderedList">1. List</button>
  <button type="button" id="add-link-btn">Add Link</button>
</div>

<div id="content" class="rich-editor"
     contenteditable="true"
     data-placeholder="Write your blog article here..."
     required></div>

        <label>SEO Title</label>
        <input id="seo-title" maxlength="65">

        <label>Meta Description</label>
        <textarea id="meta-description" rows="3"
          maxlength="160"></textarea>

        <div class="actions">
          <button type="button" id="draft-btn" class="secondary">
            Save Draft
          </button>

          <button type="submit" id="publish-btn">
            Publish Blog
          </button>
        </div>

        <p id="status-message"></p>
      </form>
    </section>

  </main>

  <script src="admin.js"></script>
</body>
</html>
